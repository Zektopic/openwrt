name: Test Build All Devices

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Space-separated target/subtarget pairs, or all'
        type: string
        default: 'all'
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  determine_targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate selected targets
        id: targets
        env:
          REQUESTED_TARGETS: ${{ inputs.targets }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          output = subprocess.check_output(
              ['perl', 'scripts/dump-target-info.pl', 'targets'], text=True
          )
          available = {line.split()[0] for line in output.splitlines() if line.strip()}
          requested = os.environ['REQUESTED_TARGETS'].split()
          selected = sorted(available if requested == ['all'] else set(requested))
          if not selected or set(selected) - available:
              raise SystemExit('Select valid target/subtarget pairs from scripts/dump-target-info.pl targets')
          matrix = []
          for pair in selected:
              target, subtarget = pair.split('/')
              matrix.append({'target': target, 'subtarget': subtarget})
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps({'include': matrix}) + '\n')
          PY

  build:
    needs: determine_targets
    permissions:
      contents: read
      packages: read
      actions: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJson(needs.determine_targets.outputs.matrix) }}
    uses: openwrt/actions-shared-workflows/.github/workflows/reusable_build.yml@main
    with:
      target: ${{ matrix.target }}
      subtarget: ${{ matrix.subtarget }}
      build_full: true
      build_all_boards: true
      include_feeds: true
