name: Build script tests

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'include/**'
      - 'config/**'
      - 'target/linux/**'
      - 'package/network/config/wifi-scripts/**'
      - 'package/network/utils/wireguard-tools/**'
      - 'package/utils/provision/**'
      - 'package/utils/ucode/**'
      - 'package/utils/nvram/**'
      - 'package/network/services/ead/**'
      - '.zektopic/TEST_SCRIPTS/**'
      - 'pytest.ini'
      - '.github/workflows/scripts.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'include/**'
      - 'config/**'
      - 'target/linux/**'
      - 'package/network/config/wifi-scripts/**'
      - 'package/network/utils/wireguard-tools/**'
      - 'package/utils/provision/**'
      - 'package/utils/ucode/**'
      - 'package/utils/nvram/**'
      - 'package/network/services/ead/**'
      - '.zektopic/TEST_SCRIPTS/**'
      - 'pytest.ini'
      - '.github/workflows/scripts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.8', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test tools
        run: |
          python -m pip install 'pytest>=8.3,<10' 'ruff>=0.9,<1'
          sudo apt-get update
          sudo apt-get install -y build-essential libpcap-dev
      - name: Check for hidden tests and undefined names
        run: ruff check --select F811,F821 scripts
      - name: Build the pinned ucode interpreter for runtime tests
        if: matrix.python == '3.12'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libjson-c-dev
          UCODE_REV=$(sed -n 's/^PKG_SOURCE_VERSION:=//p' package/utils/ucode/Makefile)
          mkdir -p "$RUNNER_TEMP/ucode-src"
          curl -fL --retry 3 "https://codeload.github.com/jow-/ucode/tar.gz/$UCODE_REV" -o "$RUNNER_TEMP/ucode.tar.gz"
          tar -xzf "$RUNNER_TEMP/ucode.tar.gz" -C "$RUNNER_TEMP/ucode-src" --strip-components=1
          cmake -S "$RUNNER_TEMP/ucode-src" -B "$RUNNER_TEMP/ucode-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/ucode-build" -j2
          echo "UCODE=$RUNNER_TEMP/ucode-build/ucode" >> "$GITHUB_ENV"
          echo "UCODE_LIB=$RUNNER_TEMP/ucode-build" >> "$GITHUB_ENV"
      - name: Run regression tests
        run: python -m pytest -q
      - name: Check Perl syntax
        run: |
          perl -I scripts -c scripts/feeds
          perl -c scripts/download.pl
          perl -c scripts/timestamp.pl
      - name: Check helper shell syntax
        run: |
          for script in .zektopic/TEST_SCRIPTS/*.sh; do
            bash -n "$script"
          done

  target-configs:
    name: Configure every supported target
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gawk libncurses-dev libssl-dev zlib1g-dev rsync unzip file wget python3-setuptools
      - name: Install feeds and prepare Kconfig
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          printf 'CONFIG_TARGET_x86=y\nCONFIG_TARGET_x86_64=y\n' > .config
          make defconfig
      - name: Resolve all device profiles
        run: python3 scripts/check-target-configs.py
      - name: Save configuration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: target-configs
          path: logs/target-configs/
          if-no-files-found: ignore
